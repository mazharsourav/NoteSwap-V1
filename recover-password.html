<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <title>Recover Password - NoteSwap</title>
    <meta name="description" content="Forgotten your NoteSwap password? Enter your email address and we will send you a reset link.">
    <link rel="canonical" href="recover-password.html">

    <!--Link preview. og:url and og:image need the real domain before launch-->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NoteSwap">
    <meta property="og:title" content="Recover Password - NoteSwap">
    <meta property="og:description" content="Forgotten your NoteSwap password? Enter your email address and we will send you a reset link.">
    <meta property="og:image" content="assets/img/logo.png">
    <meta name="twitter:card" content="summary">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap">

    <!--Icons and slider-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha384-h/hnnw1Bi4nbpD6kE7nYfCXzovi622sY5WBxww8ARKwpdLj5kUWjRuyiXaD1U2JT" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.css" integrity="sha384-gAPqlBuTCdtVcYt9ocMOYWrnBZ4XSL6q+4eXqwNycOr4iFczhNKtnYhF3NEXJM51" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="site-header"></div>

    <main id="main">

<!--Main Code-->
<section class="recovery">
    <div class="recover-box">
        <form class="recover-form" data-demo-form="If that email is registered, a reset link would be sent. This demo does not send email." novalidate>
            <div class="recover-title">
                <h1>Recover Password</h1>
            </div>
            <p class="recover-text">Enter your email to reset your password</p>
            <br>
            <label for="recover-email" class="sr-only">Email address</label>
            <input type="email" id="recover-email" name="email" placeholder="Enter your email" class="box" autocomplete="email" required>
            <span class="field-error" data-error-for="recover-email"></span>
            <button type="submit" class="btn recover-btn">Send Reset Link</button>
            <p class="form-message" role="status"></p>

            <div class="back-login">
                <p>Remember your password? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>
</section>
<!--Main Code-->



    </main>

    <div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.js" integrity="sha384-2UI1PfnXFjVMQ7/ZDEF70CR943oH3v6uZrFQGGqJYlvhh4g6z6uVktxYbOlAczav" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
