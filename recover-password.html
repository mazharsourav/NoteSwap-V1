<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <title>Recover Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="site-header"></div>

<!--Main Code-->
<section class="recovery">
    <div class="recover-box">
        <form class="recover-form" action="">
            <div class="recover-title">
                <h1>Recover Password</h1>
            </div>
            <p class="recover-text">Enter your email to reset your password</p>
            <br>
            <input type="email" placeholder="Enter your email" class="box" required>
            <input type="submit" value="Send Reset Link" class="btn recover-btn">

            <div class="back-login">
                <p>Remember your password? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>
</section>
<!--Main Code-->



    <div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
