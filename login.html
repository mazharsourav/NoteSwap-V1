<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <title>Sign-In</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div id="site-header"></div>

    <!-- <section class="heading-link"> -->
        <!-- <h3>Login to your account</h3> -->
        <!-- <p>Log-in To Access Everything. </p>
    </section> -->

    <!--Main part-->
<section class="login">
    <div class="log_in">
        <div class="login-box">
            <form class="login-form active" action="">
                <div class="login-title">
                    <h1>Login</h1>
                </div>
                    <input type="email" placeholder="Email" class="box" required>
                    <input type="password" placeholder="Password" class="box" required>
                <div class="flex">
                    <input type="checkbox" name="" id="remember-me">
                    <label for="remember-me">Remember Me</label>
                    <a href="recover-password.html">Forget Password ?</a>
                </div>
                    <input type="submit" value="login now" class="btn log-btn">

                <div class="sign-up-link">
                    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                </div>
            
            </form>
        </div>
    </div>
</section>
    
    
    <!--Main part-->


    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
