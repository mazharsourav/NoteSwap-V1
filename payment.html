<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <title>Payment</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="site-header"></div>
    <div class="payment">
        <div class="model">
            <form class="form">
                <div class="info-form">
                    <div class="input_container">
                        <label class="input_label" for="info_field">Card holder full name</label>
                        <input type="text" class="input_field" id="info_field" name="input-name" title="Inpit title" placeholder="Enter your full name">
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="info_field">Card number</label>
                        <input type="number" class="input_field" id="info_field" name="input-name" title="Inpit title" placeholder="0000 0000 0000">
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="user_type">Select subscription Type</label>
                        <select class="input_field" id="user_type" name="user_type">
                            <option value="student">Free</option>
                            <option value="teacher">Monthly</option>
                            <option value="professional">Yearly</option>
                        </select>
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="info_field">Expiry Date / CVV</label>
                        <div class="split">
                            <input type="text" class="input_field" id="info_field" name="input-name" title="Expiry Date" placeholder="01/01/23">
                            <input type="number" class="input_field" id="info_field" name="cvv" title="CVV" placeholder="CVV">
                        </div>
                    </div>
                </div>
                <button class="checkout-btn">Submit</button>
                <div class="separator">
                    <hr class="line">
                    <p>Pay using credit card</p>
                    <hr class="line">
                </div>
                <div class="payment-options">
                    <button name="paypal" type="button">
                        <img src="png/paypal.png" alt="">
                    </button>
                    <button name="apple-pay" type="button">
                        <img src="png/apple.png" alt="">
                    </button>
                    <button name="google-pay" type="button">
                        <img src="png/google.png" alt="">
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
