<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <title>Checkout - NoteSwap</title>
    <meta name="description" content="Complete your NoteSwap subscription. Choose a plan and enter your payment details.">
    <link rel="canonical" href="payment.html">

    <!--Link preview. og:url and og:image need the real domain before launch-->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NoteSwap">
    <meta property="og:title" content="Checkout - NoteSwap">
    <meta property="og:description" content="Complete your NoteSwap subscription. Choose a plan and enter your payment details.">
    <meta property="og:image" content="assets/img/logo.png">
    <meta name="twitter:card" content="summary">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap">

    <!--Icons and slider-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha384-h/hnnw1Bi4nbpD6kE7nYfCXzovi622sY5WBxww8ARKwpdLj5kUWjRuyiXaD1U2JT" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.css" integrity="sha384-gAPqlBuTCdtVcYt9ocMOYWrnBZ4XSL6q+4eXqwNycOr4iFczhNKtnYhF3NEXJM51" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="site-header"></div>

    <main id="main">
    <div class="payment">
        <div class="model">
            <form class="form" data-demo-form="This is a demo checkout. No payment was taken and no card details were sent anywhere." novalidate>
                <h1 class="checkout-title">Checkout</h1>
                <div class="info-form">
                    <div class="input_container">
                        <label class="input_label" for="card-name">Card holder full name</label>
                        <input type="text" class="input_field" id="card-name" name="card_name" autocomplete="cc-name" placeholder="Enter your full name" required>
                        <span class="field-error" data-error-for="card-name"></span>
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="card-number">Card number</label>
                        <input type="text" class="input_field" id="card-number" name="card_number" inputmode="numeric" autocomplete="cc-number" pattern="[0-9 ]{13,19}" maxlength="19" placeholder="0000 0000 0000 0000" required>
                        <span class="field-error" data-error-for="card-number"></span>
                    </div>
                    <div class="input_container">
                        <label class="input_label" for="plan">Select subscription type</label>
                        <select class="input_field" id="plan" name="plan" required>
                            <option value="free">Free</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div class="input_container">
                        <span class="input_label" aria-hidden="true">Expiry date / CVV</span>
                        <div class="split">
                            <label for="card-expiry" class="sr-only">Card expiry date, MM slash YY</label>
                            <input type="text" class="input_field" id="card-expiry" name="card_expiry" inputmode="numeric" autocomplete="cc-exp" pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" placeholder="MM/YY" required>
                            <label for="card-cvv" class="sr-only">Card security code</label>
                            <input type="text" class="input_field" id="card-cvv" name="card_cvv" inputmode="numeric" autocomplete="cc-csc" pattern="[0-9]{3,4}" maxlength="4" placeholder="CVV" required>
                        </div>
                        <span class="field-error" data-error-for="card-expiry"></span>
                        <span class="field-error" data-error-for="card-cvv"></span>
                    </div>
                </div>
                <button type="submit" class="checkout-btn">Submit</button>
                <p class="form-message" role="status"></p>
                <div class="separator">
                    <hr class="line">
                    <p>Or pay another way</p>
                    <hr class="line">
                </div>
                <div class="payment-options">
                    <button name="paypal" type="button" aria-label="Pay with PayPal">
                        <i class="fab fa-cc-paypal" aria-hidden="true"></i>
                    </button>
                    <button name="apple-pay" type="button" aria-label="Pay with Apple Pay">
                        <i class="fab fa-apple-pay" aria-hidden="true"></i>
                    </button>
                    <button name="google-pay" type="button" aria-label="Pay with Google Pay">
                        <i class="fab fa-google-pay" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="demo-notice"><i class="fas fa-circle-info" aria-hidden="true"></i> Demo checkout - do not enter a real card number.</p>
            </form>
        </div>
    </div>
    </main>

    <div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.js" integrity="sha384-2UI1PfnXFjVMQ7/ZDEF70CR943oH3v6uZrFQGGqJYlvhh4g6z6uVktxYbOlAczav" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
