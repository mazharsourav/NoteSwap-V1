<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <title>Sign-Up</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div id="site-header"></div>

    <!-- <section class="heading-link"> -->
        <!-- <h3>Login to your account</h3> -->
        <!-- <p>Log-in To Access Everything. </p>
    </section> -->

    <!--Main part-->
    <section class="signup">
        <div class="sign_up">
            <div class="signup-box">
                <form class="signup-form active" action="">
                    <div class="signup-title">
                        <h1>Sign Up</h1>
                    </div>
                    
                    <label for="full_name">Full Name - </label>
                    <input type="text" placeholder="Full Name" class="box" required>
                    
                    <label for="email">Email - </label>
                    <input type="email" placeholder="Email" class="box" required>
                    
                    <label for="password">Password</label>
                    <input type="password" placeholder="Password" class="box" required>
                    
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" placeholder="Confirm Password" class="box" required>
                    
                    <!-- University Selection -->
                    <div class="university-select">
                        <label for="university">Choose University</label>
                        <select id="university" class="box" required>
                            <option value="">Select a University</option>
                            <option value="university1">University of Asia Pacific</option>
                            <option value="university2">Brac University</option>
                            <option value="university3">North South University</option>
                            <option value="university4">American International Universityof Bangladesh</option>
                        </select>
                    </div>
    
                    <!-- Terms and Conditions Checkbox -->
                    <div class="terms">
                        <input type="checkbox" id="agree" required>
                        <label for="agree">Agree to the Terms and Conditions</label>
                    </div>
                    
                    <!-- Submit Button -->
                    <input type="submit" value="Sign Up" class="btn signup-btn">
    
                    <!-- Login Link -->
                    <div class="login-link">
                        <p>Already have an account? <a href="login.html">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>
    
    
    <!--Main part-->


    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
