<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/logo.png" type="image/png">

    <title>Sign Up - NoteSwap</title>
    <meta name="description" content="Create a free NoteSwap account to start downloading and sharing study notes with students at your university.">
    <link rel="canonical" href="signup.html">

    <!--Link preview. og:url and og:image need the real domain before launch-->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NoteSwap">
    <meta property="og:title" content="Sign Up - NoteSwap">
    <meta property="og:description" content="Create a free NoteSwap account to start downloading and sharing study notes with students at your university.">
    <meta property="og:image" content="assets/img/logo.png">
    <meta name="twitter:card" content="summary">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap">

    <!--Icons and slider-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha384-h/hnnw1Bi4nbpD6kE7nYfCXzovi622sY5WBxww8ARKwpdLj5kUWjRuyiXaD1U2JT" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.css" integrity="sha384-gAPqlBuTCdtVcYt9ocMOYWrnBZ4XSL6q+4eXqwNycOr4iFczhNKtnYhF3NEXJM51" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div id="site-header"></div>

    <main id="main">

    <!-- <section class="heading-link"> -->
        <!-- <h3>Login to your account</h3> -->
        <!-- <p>Log-in To Access Everything. </p>
    </section> -->

    <!--Main part-->
    <section class="signup">
        <div class="sign_up">
            <div class="signup-box">
                <form class="signup-form active" data-demo-form="Thanks. Account creation is not wired up yet on this demo." novalidate>
                    <div class="signup-title">
                        <h1>Sign Up</h1>
                    </div>

                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full_name" placeholder="Full Name" class="box" autocomplete="name" required>
                    <span class="field-error" data-error-for="full-name"></span>

                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="Email" class="box" autocomplete="email" required>
                    <span class="field-error" data-error-for="signup-email"></span>

                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Password" class="box" autocomplete="new-password" minlength="8" required>
                    <span class="field-error" data-error-for="signup-password"></span>

                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" class="box" autocomplete="new-password" data-must-match="signup-password" required>
                    <span class="field-error" data-error-for="confirm-password"></span>

                    <!--University Selection-->
                    <div class="university-select">
                        <label for="university">Choose University</label>
                        <select id="university" name="university" class="box" required>
                            <option value="">Select a University</option>
                            <option value="uap">University of Asia Pacific</option>
                            <option value="brac">Brac University</option>
                            <option value="nsu">North South University</option>
                            <option value="aiub">American International University of Bangladesh</option>
                        </select>
                        <span class="field-error" data-error-for="university"></span>
                    </div>

                    <!--Terms and Conditions Checkbox-->
                    <div class="terms">
                        <input type="checkbox" id="agree" name="agree" required>
                        <label for="agree">I agree to the <a href="terms.html">Terms and Conditions</a></label>
                        <span class="field-error" data-error-for="agree"></span>
                    </div>

                    <!--Submit Button-->
                    <button type="submit" class="btn signup-btn">Sign Up</button>
                    <p class="form-message" role="status"></p>

                    <!--Login Link-->
                    <div class="login-link">
                        <p>Already have an account? <a href="login.html">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>
    
    
    <!--Main part-->


    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.js" integrity="sha384-2UI1PfnXFjVMQ7/ZDEF70CR943oH3v6uZrFQGGqJYlvhh4g6z6uVktxYbOlAczav" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
